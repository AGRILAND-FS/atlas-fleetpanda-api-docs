swagger: "2.0"
info:
  title: "API-100-Panda-IngestEvents"
  version: "1.0.0"
  description: "Lambda-backed FleetPanda ingestion endpoint for shift events."

host: "bjnikcmsnc.execute-api.us-east-1.amazonaws.com"
basePath: "/dev"
schemes:
  - https

consumes:
  - application/json
produces:
  - application/json

paths:
  /fleetpanda/events/{objectType}:
    post:
      summary: "Ingest a FleetPanda shift event"
      parameters:
        - name: objectType
          in: path
          required: true
          type: string
          enum: [shift]

        - name: body
          in: body
          required: true
          schema:
            $ref: "#/definitions/ShiftEventRequest"

      responses:
        "202":
          description: Accepted
        "400":
          description: Validation error

securityDefinitions:
  FleetPandaAuthorizer:
    type: apiKey
    name: Authorization
    in: header

definitions:

  ShiftEventRequest:
    type: object
    required:
      - canonical_payload
    properties:
      tenant_id:
        type: integer
      canonical_payload:
        $ref: "#/definitions/CanonicalShiftPayload"

    example:
      tenant_id: 100
      canonical_payload:
        entity_type: "shift"
        shift_id: 100001
        shift_summary_id: 100002
        tenant_id: 100

        worker:
          worker_id: 1001
          name: "John Smith"
          erp_id: "ERP-DRV-001"

        delivery_truck:
          truck_id: 200001
          erp_id: "TRK-001"
          license_plate: "TRK-001"

        order_groups:
          - entity_type: "order_group"
            order_group_id: 600001
            tenant_id: 100
            order_type: "DeliveryOrder"

            order:
              order_type: "delivery_order"
              order_id: 500001
              tenant_id: 100
              order_number: "600001"
              po_number: "N/A"
              bol_number: "N/A"
              planned_date: "2026-02-26 08:46:52 -0800"
              planned_time: "08:46"
              completed_date: "2026-02-26 12:24:09 -0800"
              completed_time: "12:24"
              external_bo_id: "EXT-BO-001"

              driver:
                id: 1001
                erp_id: "ERP-DRV-001"
                name: "John Smith"

              truck:
                id: 200001
                erp_id: "TRK-001"
                license_plate_number: "TRK-001"

              customer:
                id: 300001
                erp_id: "CUST-001"
                name: "Acme Industries"

              customer_branch:
                id: 400001
                erp_id: "CUST-001-001"
                name: "Acme Industries - Main St Springfield IL"

              shipping_address:
                street_1: "123 Main St"
                city: "Springfield"
                postal_code: "62701"
                state: "Illinois"
                state_code: "IL"

              line_items:
                - line_item_id: 700001
                  product_id: 40873
                  product_erp_id: "69306"
                  product_name: "Gas"
                  product_description: "Gas"
                  unit_of_measure: "gallon"
                  quantity: 450.3
                  requested_quantity: 1

              fees:
                - name: "LP Reg Comp"
                  erp_id: "72809"
                  rate: 9.5
                  quantity: 1
                  total: 9.5

              pricings:
                - product_erp_id: "69306"
                  quantity: 450.3
                  rate: 0
                  total: 0
                  discount: 0
                  sum_total: 0

  CanonicalShiftPayload:
    type: object
    required:
      - entity_type
      - shift_id
      - shift_summary_id
      - worker
      - delivery_truck
      - order_groups
    properties:
      entity_type:
        type: string
      shift_id:
        type: integer
      shift_summary_id:
        type: integer
      tenant_id:
        type: integer
      worker:
        type: object
      delivery_truck:
        type: object
      order_groups:
        type: array
        items:
          $ref: "#/definitions/OrderGroup"

  OrderGroup:
    type: object
    required:
      - order_group_id
      - order_type
      - order
    properties:
      order_group_id:
        type: integer
      tenant_id:
        type: integer
      order_type:
        type: string
      order:
        $ref: "#/definitions/Order"

  Order:
    type: object
    required:
      - order_id
      - order_type
      - order_number
      - po_number
      - bol_number
      - planned_date
      - planned_time
      - completed_date
      - completed_time
      - external_bo_id
      - driver
      - truck
      - customer
      - customer_branch
      - shipping_address
      - line_items
      - fees
      - pricings
    properties:
      order_id:
        type: integer
      order_type:
        type: string
      order_number:
        type: string
      po_number:
        type: string
      bol_number:
        type: string
      planned_date:
        type: string
      planned_time:
        type: string
      completed_date:
        type: string
      completed_time:
        type: string
      external_bo_id:
        type: string
      driver:
        type: object
      truck:
        type: object
      customer:
        type: object
      customer_branch:
        type: object
      shipping_address:
        type: object
      line_items:
        type: array
        items:
          type: object
      fees:
        type: array
        items:
          type: object
      pricings:
        type: array
        items:
          type: object
