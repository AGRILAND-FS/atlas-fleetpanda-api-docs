swagger: "2.0"
info:
  title: "API-100-Panda-IngestEvents"
  version: "1.3.0"
  description: |
    Lambda-backed FleetPanda ingestion endpoint for shift events.

    ---

    ## Authentication

    All requests require a Bearer token from the FleetPanda Cognito user pool.
    Contact the platform team for your client ID, client secret, and scope value.

    **Step 1 — Get a token**

    Send a `POST` to the Cognito OAuth2 token endpoint using the client credentials flow.

    **Postman setup:**

    ```
    Method:   POST
    URL:      https://us-east-18i9ska4jb.auth.us-east-1.amazoncognito.com/oauth2/token

    Authorization tab:
      Type:     Basic Auth
      Username: <client_id>
      Password: <client_secret>

    Headers:
      Content-Type: application/x-www-form-urlencoded

    Body (x-www-form-urlencoded):
      grant_type = client_credentials
      scope      = default-m2m-resource-server-i2giob/write
    ```

    **curl equivalent:**

    ```
    curl -X POST https://us-east-18i9ska4jb.auth.us-east-1.amazoncognito.com/oauth2/token \
      -H "Content-Type: application/x-www-form-urlencoded" \
      -u "<client_id>:<client_secret>" \
      -d "grant_type=client_credentials&scope=default-m2m-resource-server-i2giob/write"
    ```

    Copy the `access_token` value from the response.

    **Step 2 — Authorize in Swagger UI:**

    Click the **Authorize** button at the top right of this page. In the Value field, enter your token with the `Bearer` prefix:

    ```
    Bearer <access_token>
    ```

    > The `Bearer` prefix is required. Entering the token alone will result in a 401.

    ---

    ## Response Codes

    | Code | Meaning |
    |------|---------|
    | `202 Accepted` | Payload validated and written to S3. Does **not** guarantee downstream Glue success. |
    | `400 Bad Request` | Payload failed validation. See `message`, `detail`, and `missing_fields` in the response body. |
    | `500 Internal Error` | Storage failure on our side. Quote the `ref` value when reporting it. |

    ## Reading Error Responses (v1.2.0)

    Every response, success or error, includes a `request_id`. Quote it when asking us
    about a request and we can find it in our logs immediately.

    Validation does **not** stop at the first problem: the `missing_fields` array in a
    `Payload validation failed` response lists **every** failing field with its exact path,
    including the order group index (e.g. `canonical_payload.order_groups[2].order.driver.erp_id`).
    Type errors state what was received, e.g. `tenant_id must be an integer, got string`.
    Most other 400s include a `detail` field explaining what was received vs expected.

    Important: post the shift payload itself. If your system fails to build a shift and
    posts its own error object instead (`success: false` + `error`), the API returns
    `Missing or invalid canonical_payload` with a `detail` explaining that the body was
    an error callback. Nothing is ingested in that case.

    ## Validation Rules Worth Knowing

    - `tenant_id`, `shift_id`, `shift_summary_id` must be JSON integers. Strings and booleans are rejected.
    - **Optional since v1.3.0:** `worker.erp_id`, `delivery_truck.erp_id`, and order-level `driver.erp_id` may be omitted (these entities do not always carry an ERP id). `driver.id` and `driver.name` are still required on every delivery order.
    - **Still required and non-empty:** `customer.erp_id`, `customer_branch.erp_id` (the ERP ship-to code — the only field tying a delivery to the ERP ship-to), order-level `truck.erp_id`, and `product_erp_id` on every line item. Test entities must have these populated the way production data will.
    - `line_items`, `fees`, `pricings` must be JSON arrays when present. An object where an array is expected is a 400.
    - A LoadingOrder group may use `order` (single) or `orders` (array), not both: sending a non-empty `orders` alongside `order` is rejected as ambiguous. An empty `orders` array is treated as absent.

host: "bjnikcmsnc.execute-api.us-east-1.amazonaws.com"
basePath: "/dev"
schemes:
  - https

consumes:
  - application/json
produces:
  - application/json

paths:
  /fleetpanda/events/{objectType}:
    post:
      summary: "Ingest a FleetPanda shift event"
      description: |
        Accepts a FleetPanda shift payload, validates required fields, and writes
        the raw payload to S3. Only `shift` is currently supported as an object type.

        On success, EventBridge triggers the Glue workflow to process the raw file
        into staged Parquet tables. The 202 response does not confirm downstream success —
        check CloudWatch and the staged S3 paths separately.
      parameters:
        - name: objectType
          in: path
          required: true
          type: string
          enum: [shift]
          description: "Only 'shift' is supported."

        - name: body
          in: body
          required: true
          schema:
            $ref: "#/definitions/ShiftEventRequest"

      responses:
        "202":
          description: "Accepted — payload validated and written to S3."
          schema:
            $ref: "#/definitions/AcceptedResponse"
        "400":
          description: "Validation error — payload failed one or more checks."
          schema:
            $ref: "#/definitions/ErrorResponse"

      security:
        - FleetPandaAuthorizer: []

securityDefinitions:
  FleetPandaAuthorizer:
    type: apiKey
    name: Authorization
    in: header
    x-amazon-apigateway-authtype: cognito_user_pools
    x-amazon-apigateway-authorizer:
      type: cognito_user_pools
      providerARNs:
        - "arn:aws:cognito-idp:us-east-1:895774352078:userpool/us-east-1_8i9ska4jb"

definitions:

  # -------------------------------------------------------
  # TOP-LEVEL REQUEST
  # -------------------------------------------------------

  ShiftEventRequest:
    type: object
    required:
      - tenant_id
      - canonical_payload
    properties:
      tenant_id:
        type: integer
        description: "Top-level tenant identifier. Required and must be an integer."
      canonical_payload:
        $ref: "#/definitions/CanonicalShiftPayload"

    example:
      tenant_id: 100
      canonical_payload:
        entity_type: "shift"
        shift_id: 100001
        shift_summary_id: 100002
        worker:
          worker_id: 1001
          name: "John Smith"
          erp_id: "ERP-DRV-001"
        delivery_truck:
          truck_id: 200001
          erp_id: "TRK-001"
          license_plate: "TRK-001"
        order_groups:
          - entity_type: "order_group"
            order_group_id: 600001
            tenant_id: 100
            order_type: "DeliveryOrder"
            order:
              order_type: "delivery_order"
              order_id: 500001
              tenant_id: 100
              order_number: "600001"
              planned_date: "2026-02-26 08:46:52 -0800"
              planned_time: "08:46"
              completed_date: "2026-02-26 12:24:09 -0800"
              completed_time: "12:24"
              driver:
                id: 1001
                erp_id: "ERP-DRV-001"
                name: "John Smith"
              truck:
                id: 200001
                erp_id: "TRK-001"
                license_plate_number: "TRK-001"
              customer:
                id: 300001
                erp_id: "CUST-001"
                name: "Acme Industries"
              customer_branch:
                id: 400001
                erp_id: "CUST-001-001"
                name: "Acme Industries - Main St Springfield IL"
              shipping_address:
                street_1: "123 Main St"
                city: "Springfield"
                postal_code: "62701"
                state: "Illinois"
                state_code: "IL"
              line_items:
                - line_item_id: 700001
                  product_id: 40873
                  product_erp_id: "69306"
                  product_name: "Gas"
                  product_description: "Gas"
                  unit_of_measure: "gallon"
                  quantity: 450.3
                  requested_quantity: 1
              fees:
                - name: "LP Reg Comp"
                  erp_id: "72809"
                  rate: 9.5
                  quantity: 1
                  total: 9.5
              pricings:
                - product_erp_id: "69306"
                  quantity: 450.3
                  rate: 0
                  total: 0
                  sum_total: 0

  # -------------------------------------------------------
  # CANONICAL PAYLOAD
  # -------------------------------------------------------

  CanonicalShiftPayload:
    type: object
    required:
      - entity_type
      - shift_id
      - shift_summary_id
      - worker
      - delivery_truck
      - order_groups
    properties:
      entity_type:
        type: string
        enum: ["shift"]
        description: "Must be 'shift'."
      shift_id:
        type: integer
        description: "Required. Must be an integer."
      shift_summary_id:
        type: integer
        description: "Required. Must be an integer."
      tenant_id:
        type: integer
        description: "Optional at this level — top-level tenant_id on the request body is what is validated."
      worker:
        $ref: "#/definitions/Worker"
      delivery_truck:
        $ref: "#/definitions/DeliveryTruck"
      order_groups:
        type: array
        minItems: 1
        description: "Required. Must be a non-empty array of order group objects."
        items:
          $ref: "#/definitions/OrderGroup"

  # -------------------------------------------------------
  # WORKER / TRUCK (shift-level)
  # -------------------------------------------------------

  Worker:
    type: object
    required:
      - worker_id
      - name
    properties:
      worker_id:
        type: integer
      erp_id:
        type: string
        description: "Optional since v1.3.0. Include when the worker has an ERP id assigned."
      name:
        type: string

  DeliveryTruck:
    type: object
    required:
      - truck_id
      - license_plate
    properties:
      truck_id:
        type: integer
      erp_id:
        type: string
        description: "Optional since v1.3.0. The order-level truck.erp_id remains required."
      license_plate:
        type: string
        description: "Note: shift-level truck uses 'license_plate'. Order-level truck uses 'license_plate_number'."

  # -------------------------------------------------------
  # ORDER GROUPS
  # -------------------------------------------------------

  OrderGroup:
    type: object
    required:
      - order_group_id
      - order_type
    properties:
      order_group_id:
        type: integer
      tenant_id:
        type: integer
        description: "Required for DeliveryOrder groups. May alternatively be supplied on the order object."
      order_type:
        type: string
        enum: ["DeliveryOrder", "LoadingOrder", "TransferOrder"]
        description: |
          Determines which validation path is applied:
          - DeliveryOrder: requires `order` (single object) with full delivery fields.
          - LoadingOrder: accepts either `order` (single object) or `orders` (array of objects),
            but NOT both — a non-empty `orders` alongside `order` is rejected as ambiguous.
            An empty `orders` array is treated as absent (the `order` object is used).
          - TransferOrder: accepted with only order_group_id/order_type validated; processed
            into transfer-order staged tables downstream.
      order:
        $ref: "#/definitions/Order"
        description: "Used for DeliveryOrder (required) and LoadingOrder (alternative to `orders`, not alongside it)."
      orders:
        type: array
        description: "LoadingOrder only. Alternative to `order` when the group contains multiple loading orders. Do not send alongside `order`."
        items:
          $ref: "#/definitions/LoadingOrder"

  # -------------------------------------------------------
  # DELIVERY ORDER
  # -------------------------------------------------------

  Order:
    type: object
    description: "Delivery order object. All fields listed as required are validated by Lambda."
    required:
      - order_id
      - order_type
      - order_number
      - planned_date
      - planned_time
      - completed_date
      - completed_time
      - driver
      - truck
      - customer
      - customer_branch
      - shipping_address
      - line_items
    properties:
      order_id:
        type: integer
      order_type:
        type: string
      order_number:
        type: string
      po_number:
        type: string
        description: "Optional."
      bol_number:
        type: string
        description: "Optional."
      planned_date:
        type: string
      planned_time:
        type: string
      completed_date:
        type: string
      completed_time:
        type: string
      external_bo_id:
        type: string
        description: "Optional."
      driver:
        $ref: "#/definitions/OrderDriver"
      truck:
        $ref: "#/definitions/OrderTruck"
      customer:
        $ref: "#/definitions/Customer"
      customer_branch:
        $ref: "#/definitions/CustomerBranch"
      shipping_address:
        $ref: "#/definitions/ShippingAddress"
      line_items:
        type: array
        description: "Required. Validated if present."
        items:
          $ref: "#/definitions/LineItem"
      fees:
        type: array
        description: "Optional. Validated if present."
        items:
          $ref: "#/definitions/Fee"
      pricings:
        type: array
        description: "Optional. Validated if present."
        items:
          $ref: "#/definitions/Pricing"

  # -------------------------------------------------------
  # LOADING ORDER
  # -------------------------------------------------------

  LoadingOrder:
    type: object
    description: "Loading order object. Validation is minimal compared to delivery orders."
    required:
      - order_id
      - order_type
      - order_number
      - line_items
    properties:
      order_id:
        type: integer
      order_type:
        type: string
      order_number:
        type: string
      line_items:
        type: array
        description: "Required. Each item must have line_item_id."
        items:
          $ref: "#/definitions/LoadingLineItem"
      completed_date:
        type: string
        description: "Optional."
      completed_time:
        type: string
        description: "Optional."
      hub:
        type: object
        description: "Optional. Hub/terminal reference."

  # -------------------------------------------------------
  # DRIVER / TRUCK (order-level)
  # -------------------------------------------------------

  OrderDriver:
    type: object
    required:
      - id
      - name
    properties:
      id:
        type: integer
      erp_id:
        type: string
        description: "Optional since v1.3.0. May become required again in a future version once driver ERP identification is settled."
      name:
        type: string

  OrderTruck:
    type: object
    required:
      - id
      - erp_id
      - license_plate_number
    properties:
      id:
        type: integer
      erp_id:
        type: string
      license_plate_number:
        type: string
        description: "Note: order-level truck uses 'license_plate_number'. Shift-level delivery_truck uses 'license_plate'."

  # -------------------------------------------------------
  # CUSTOMER / ADDRESS
  # -------------------------------------------------------

  Customer:
    type: object
    required:
      - id
      - erp_id
      - name
    properties:
      id:
        type: integer
      erp_id:
        type: string
      name:
        type: string

  CustomerBranch:
    type: object
    required:
      - id
      - erp_id
      - name
    properties:
      id:
        type: integer
      erp_id:
        type: string
      name:
        type: string

  ShippingAddress:
    type: object
    required:
      - street_1
      - city
      - state
      - state_code
      - postal_code
    properties:
      street_1:
        type: string
      city:
        type: string
      state:
        type: string
      state_code:
        type: string
      postal_code:
        type: string

  # -------------------------------------------------------
  # LINE ITEMS / FEES / PRICING
  # -------------------------------------------------------

  LineItem:
    type: object
    description: "Delivery order line item. All fields are required when the array is present."
    required:
      - line_item_id
      - product_id
      - product_erp_id
      - product_name
      - quantity
      - requested_quantity
      - unit_of_measure
    properties:
      line_item_id:
        type: integer
      product_id:
        type: integer
      product_erp_id:
        type: string
      product_name:
        type: string
      product_description:
        type: string
        description: "Optional."
      quantity:
        type: number
      requested_quantity:
        type: number
      unit_of_measure:
        type: string

  LoadingLineItem:
    type: object
    description: "Loading order line item. Only line_item_id is required by Lambda validation."
    required:
      - line_item_id
    properties:
      line_item_id:
        type: integer
      product_id:
        type: integer
      product_erp_id:
        type: string
      product_name:
        type: string
      product_description:
        type: string
      quantity:
        type: number
      requested_quantity:
        type: number
      unit_of_measure:
        type: string

  Fee:
    type: object
    description: "Optional. Validated by Lambda only when the fees array is present."
    required:
      - name
      - erp_id
      - rate
      - quantity
      - total
    properties:
      name:
        type: string
        description: "Input field name in the payload. Staged as 'fee_name' in Athena."
      erp_id:
        type: string
        description: "Input field name in the payload. Staged as 'fee_erp_id' in Athena."
      rate:
        type: number
      quantity:
        type: number
      total:
        type: number

  Pricing:
    type: object
    description: "Optional. Validated by Lambda only when the pricings array is present."
    required:
      - product_erp_id
      - quantity
      - rate
      - total
      - sum_total
    properties:
      product_erp_id:
        type: string
      quantity:
        type: number
      rate:
        type: number
      total:
        type: number
      discount:
        type: number
        description: "Optional."
      sum_total:
        type: number

  # -------------------------------------------------------
  # RESPONSES
  # -------------------------------------------------------

  AcceptedResponse:
    type: object
    properties:
      message:
        type: string
        example: "Shift event accepted"
      objectType:
        type: string
        example: "shift"
      received:
        type: boolean
        example: true
      request_id:
        type: string
        description: "API Gateway request id. Quote it when asking about a request."
        example: "2cc4bc81-3148-4bb7-a193-ab0d8cb408f5"

  ErrorResponse:
    type: object
    properties:
      message:
        type: string
        example: "Payload validation failed"
      detail:
        type: string
        description: "Human-readable explanation of what was received vs expected. Present on most errors."
        example: "2 problem(s) found; every problem is listed in missing_fields (validation does not stop at the first)"
      missing_fields:
        type: array
        description: "Present on field-validation failures. Lists EVERY failing field path (validation does not stop at the first error). Type errors state what was received."
        items:
          type: string
        example:
          - "canonical_payload.shift_id must be an integer, got string"
          - "canonical_payload.order_groups[0].order.driver.erp_id"
      request_id:
        type: string
        description: "API Gateway request id. Quote it when asking about a request."
        example: "2cc4bc81-3148-4bb7-a193-ab0d8cb408f5"
